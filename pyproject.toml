[project]
name = "research-agent"
version = "0.1.0"
description = "Research assistant agent that searches PubMed and writes cited summaries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.5",
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.15",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["src", "evals", "tests"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
