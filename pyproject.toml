[project]
name = "research-agent"
version = "0.1.0"
description = "Research assistant agent that searches PubMed and writes cited summaries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.14",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
